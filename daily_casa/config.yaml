name: "Daily Casa"
slug: "daily_casa"
description: "Tarefas e rotinas domésticas partilhadas"
version: "3.6.0"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 3000
# Acesso direto (opcional, desligado por omissão): para instalar a app no telemóvel sem o cabeçalho do Home Assistant.
# Liga-se em Definições → Aplicações → Daily Casa → Configuração → Rede (ex.: 3000). Só fica acessível na rede de casa.
ports:
  3000/tcp: null
ports_description:
  3000/tcp: "Acesso direto na rede de casa (para instalar no ecrã principal do telemóvel). Deixe em branco para desligar."
panel_icon: "mdi:home-variant-outline"
panel_title: "Daily Casa"
panel_admin: false
backup: cold
# Notificações e sensores (opcionais, desligados até serem configurados em Definições → Home Assistant).
homeassistant_api: true
hassio_api: true
# Recuperação da palavra-passe por email (opcional). Conta Gmail com verificação em dois passos e uma
# «palavra-passe de aplicação» (myaccount.google.com/apppasswords). A palavra-passe fica só nas opções do add-on.
options:
  email_remetente: ""
  email_palavra_passe: ""
  email_nome: "Daily Casa"
schema:
  email_remetente: "str"
  email_palavra_passe: "password"
  email_nome: "str"
