name: Atualizar ícones Casa em Dia 1.5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/brand-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1.5-product-experience
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar PNG aprovados a partir de SVG
        run: |
          pip install cairosvg pillow
          python casa_em_dia/build_brand.py
      - name: Guardar assets na branch beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casa_em_dia/public/*.png casa_em_dia/icon.png casa_em_dia/logo.png
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar PNG da marca aprovada Casa em Dia 1.5"
            git push origin HEAD:feature/1.5-product-experience
          fi
