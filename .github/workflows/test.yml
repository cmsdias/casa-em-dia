name: Verificar Casa em Dia
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'casa_em_dia/**'
      - 'docs/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Servidor e persistência
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: npm run check
        working-directory: casa_em_dia
      - name: Testes de integração (servidor, perfis, finanças)
        run: npm test
        working-directory: casa_em_dia

  browser:
    name: Interface (desktop e iPhone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de testes
        working-directory: casa_em_dia
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verificar layout e navegação
        working-directory: casa_em_dia
        run: npm run test:ui
      - name: Guardar capturas dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interface
          path: casa_em_dia/ui-screens/
          if-no-files-found: ignore
