name: Verificar Casa em Dia
on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]
    paths:
      - 'casa_em_dia/**'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: npm run check
        working-directory: casa_em_dia
      - name: Testes de integração (servidor e persistência)
        run: npm test
        working-directory: casa_em_dia

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de testes
        working-directory: casa_em_dia
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verificar layout e navegação em desktop e iPhone
        working-directory: casa_em_dia
        run: node test-ui.js
      - name: Guardar capturas dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-em-dia-1-5-ui
          path: casa_em_dia/ui-screens/
          if-no-files-found: ignore
