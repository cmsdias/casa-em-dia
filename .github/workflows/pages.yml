name: Publicar demonstração Casa em Dia
# Demonstração pública com dados fictícios (localStorage). Nunca contém dados reais.
#   /       → versão estável (branch main)
#   /next/  → próxima versão: branch de um PR com testes aprovados, ou a branch indicada manualmente
#
# O GitHub Pages só aceita publicações a partir da branch principal. Por isso este workflow corre
# sempre a partir de main e vai buscar o código da pré-visualização ao commit indicado.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'casa_em_dia/public/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Verificar Casa em Dia']
    types: [completed]
  workflow_dispatch:
    inputs:
      next_ref:
        description: 'Branch, tag ou commit a publicar em /next/'
        required: false
        default: 'main'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Só publica pré-visualizações de PR com testes aprovados e vindos deste repositório (nunca de forks).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter versão estável (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Obter próxima versão
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.next_ref || 'main' }}
          path: next
      - name: Montar demonstração sem dados privados
        run: |
          build() {
            src="$1"; dest="$2"
            mkdir -p "$dest"
            # Recursos públicos da interface, sem service worker (a demonstração não é instalável).
            cp -R "$src/casa_em_dia/public/." "$dest/"
            rm -f "$dest/sw.js"
            cp "$src/docs/index.html" "$dest/index.html"
          }
          build stable _site
          build next _site/next
          touch _site/.nojekyll
          echo "Publicado: / = main, /next/ = ${{ github.event.workflow_run.head_branch || inputs.next_ref || 'main' }}"
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Carregar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
