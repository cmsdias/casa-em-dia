name: Publicar demonstração Casa em Dia
on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'casa_em_dia/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Obter versão de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: develop
          path: dev-source
      - name: Obter versão estável
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-source
      - name: Obter beta 1.2
        uses: actions/checkout@v4
        with:
          ref: feature/1.2-household
          path: beta-source
      - name: Montar demonstracao sem dados privados
        run: |
          mkdir -p _site
          cp stable-source/docs/index.html _site/index.html
          cp stable-source/casa_em_dia/public/style.css stable-source/casa_em_dia/public/app.js _site/
          cp -R stable-source/casa_em_dia/public/assets _site/assets
          mkdir -p _site/dev
          cp dev-source/docs/index.html _site/dev/index.html
          cp dev-source/casa_em_dia/public/style.css dev-source/casa_em_dia/public/app.js _site/dev/
          cp -R dev-source/casa_em_dia/public/assets _site/dev/assets
          mkdir -p _site/beta
          cp beta-source/docs/index.html _site/beta/index.html
          cp beta-source/casa_em_dia/public/style.css beta-source/casa_em_dia/public/app.js _site/beta/
          cp -R beta-source/casa_em_dia/public/assets _site/beta/assets
          touch _site/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Carregar site estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
